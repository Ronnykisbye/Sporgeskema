<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Interaktivt spørgeskema til AU-afgangsprojekt i informationsteknologi." />
  <title>Spørgeskema om AI og IT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="survey-card" aria-live="polite">
      <header class="survey-header">
        <div>
          <p class="eyebrow">AU · Informationsteknologi</p>
          <h1>Spørgeskema om AI og IT</h1>
          <p class="intro">Kort interaktiv undersøgelse om brug af AI i hverdagen og i IT.</p>
        </div>
        <div class="progress-wrap" aria-label="Fremdrift">
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          <span id="progressText">Klar</span>
        </div>
      </header>

      <div id="screen" class="screen"></div>

      <footer class="survey-footer">
        <button id="backBtn" class="btn btn-secondary" type="button" disabled>Tilbage</button>
        <button id="nextBtn" class="btn btn-primary" type="button">Start</button>
      </footer>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
